<svg xmlns="http://www.w3.org/2000/svg" width="980" height="280" viewBox="0 0 980 280" font-family="Segoe UI, Arial, sans-serif">
  <rect width="980" height="280" fill="#ffffff"/>
  <text x="30" y="38" font-size="22" font-weight="700" fill="#1f2937">Proposed telemetry frame (not implemented in the archived firmware)</text>
  <text x="30" y="63" font-size="13" fill="#6b7280">Fixed header and terminator, explicit length, CRC-16 over the payload</text>

  <g font-size="14" text-anchor="middle">
    <rect x="30" y="100" width="80" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="70" y="128" font-weight="700" fill="#1e3a8a">0x24 header</text>
    <text x="70" y="149" fill="#475569">1 byte</text>

    <rect x="110" y="100" width="100" height="70" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
    <text x="160" y="128" font-weight="700" fill="#0f172a">LEN</text>
    <text x="160" y="149" fill="#475569">1 byte</text>

    <rect x="210" y="100" width="430" height="70" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="425" y="128" font-weight="700" fill="#14532d">PAYLOAD — TLV records, 0–64 bytes</text>
    <text x="425" y="149" fill="#475569">timestamp · roll · pitch · accel · pressure · temperature · GNSS · status</text>

    <rect x="640" y="100" width="150" height="70" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="715" y="128" font-weight="700" fill="#78350f">CRC-16</text>
    <text x="715" y="149" fill="#475569">CCITT-FALSE, 2 bytes</text>

    <rect x="790" y="100" width="80" height="70" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <text x="830" y="128" font-weight="700" fill="#1e3a8a">0x2A terminator</text>
    <text x="830" y="149" fill="#475569">1 byte</text>
  </g>

  <g font-size="12" fill="#475569">
    <text x="30" y="205">Archived ground station: regular expression over free-form text, no length field, no integrity check, vulnerable to packet fragmentation.</text>
    <text x="30" y="228">Recommended firmware change: emit this binary frame at a fixed rate; make the ground station resynchronize on the header and reject bad CRC.</text>
    <text x="30" y="251">The CRC polynomial and byte order must be fixed in the flight firmware and documented before deployment.</text>
  </g>
</svg>
