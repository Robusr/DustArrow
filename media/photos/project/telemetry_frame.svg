<svg xmlns="http://www.w3.org/2000/svg" width="183mm" height="86mm" viewBox="0 0 1830 860" font-family="Arial, Helvetica, sans-serif">
<defs><marker id="arrowInk" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#111827"/></marker><marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#1D4ED8"/></marker><marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#A85A0A"/></marker><marker id="arrowGreen" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F6B4F"/></marker><marker id="arrowRule" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L9,4.5 L0,9 z" fill="#94A3B8"/></marker></defs>
<rect width="1830" height="860" fill="#FFFFFF"/>
<text x="50.0" y="52.0" font-family="Arial, Helvetica, sans-serif" font-size="24.0" font-weight="700" fill="#111827" text-anchor="start">Proposed telemetry frame — CRC-16 protected</text>
<text x="50.0" y="86.0" font-family="Arial, Helvetica, sans-serif" font-size="19.0" fill="#111827" text-anchor="start">A replacement for the archived free-form text stream; not implemented in the flight firmware</text>
<line x1="50.0" y1="110.0" x2="1780.0" y2="110.0" stroke="#CBD5E1" stroke-width="1"/>
<rect x="100.0" y="145.0" width="160.0" height="100.0" rx="3" fill="#EAF1FB" stroke="#3B6EA5" stroke-width="1.5"/>
<text x="180.0" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="20.0" font-weight="700" fill="#111827" text-anchor="middle">0x24</text>
<text x="180.0" y="213.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="middle">header · 1 B</text>
<rect x="260.0" y="145.0" width="120.0" height="100.0" rx="3" fill="#F5F7FA" stroke="#94A3B8" stroke-width="1.5"/>
<text x="320.0" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="20.0" font-weight="700" fill="#111827" text-anchor="middle">LEN</text>
<text x="320.0" y="213.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="middle">1 B · 0–64</text>
<rect x="380.0" y="145.0" width="920.0" height="100.0" rx="3" fill="#EDF5F0" stroke="#4B8065" stroke-width="1.5"/>
<text x="840.0" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="20.0" font-weight="700" fill="#111827" text-anchor="middle">PAYLOAD</text>
<text x="840.0" y="213.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="middle">0–64 bytes · fixed fields or TLV</text>
<rect x="1300.0" y="145.0" width="250.0" height="100.0" rx="3" fill="#FFF5E8" stroke="#B7792A" stroke-width="1.5"/>
<text x="1425.0" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="20.0" font-weight="700" fill="#111827" text-anchor="middle">CRC-16</text>
<text x="1425.0" y="213.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="middle">CCITT-FALSE · 2 B</text>
<rect x="1550.0" y="145.0" width="200.0" height="100.0" rx="3" fill="#EAF1FB" stroke="#3B6EA5" stroke-width="1.5"/>
<text x="1650.0" y="183.0" font-family="Arial, Helvetica, sans-serif" font-size="20.0" font-weight="700" fill="#111827" text-anchor="middle">0x2A</text>
<text x="1650.0" y="213.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="middle">terminator · 1 B</text>
<text x="100.0" y="272.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-style="italic" fill="#111827" text-anchor="start">Frame length = 1 + 1 + N + 2 + 1 = N + 5 bytes, where N is the payload length.</text>
<rect x="100.0" y="300.0" width="850.0" height="190.0" rx="7" fill="#F5F7FA" stroke="#94A3B8" stroke-width="1.3"/>
<text x="118.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="19.0" font-weight="700" fill="#111827" text-anchor="start">Tested payload (test_protocol.py)</text>
<text x="118.0" y="360.0" font-family="Menlo, Courier New, monospace" font-size="18.0" fill="#111827" text-anchor="start">struct.pack(&#x27;&lt;I5f&#x27;, t, roll, pitch, a, b, c)</text>
<text x="118.0" y="388.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">= 24 bytes: u32 timestamp + five f32 values</text>
<text x="118.0" y="420.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">The frame carries an arbitrary payload; the payload schema</text>
<text x="118.0" y="445.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">belongs to the firmware and is not in the archive.</text>
<rect x="980.0" y="300.0" width="770.0" height="190.0" rx="7" fill="#EDF5F0" stroke="#4B8065" stroke-width="1.3"/>
<text x="998.0" y="330.0" font-family="Arial, Helvetica, sans-serif" font-size="19.0" font-weight="700" fill="#111827" text-anchor="start">Properties exercised by the tests</text>
<text x="998.0" y="362.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">resynchronizes on 0x24 after noise</text>
<text x="998.0" y="390.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">reassembles a frame delivered byte by byte</text>
<text x="998.0" y="418.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">rejects a payload with a bad CRC</text>
<text x="998.0" y="446.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">accepts several frames in one serial read</text>
<rect x="100.0" y="520.0" width="1650.0" height="120.0" rx="7" fill="#F5F7FA" stroke="#94A3B8" stroke-width="1.3"/>
<text x="118.0" y="548.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-weight="700" fill="#111827" text-anchor="start">Example frame from the test vector (29 bytes; 0x18 = 24 payload bytes)</text>
<text x="118.0" y="580.0" font-family="Menlo, Courier New, monospace" font-size="18.0" fill="#111827" text-anchor="start">24 18 D2 04 00 00 00 00 20 41 00 00 A0 C1 00 00 80 3F</text>
<text x="118.0" y="608.0" font-family="Menlo, Courier New, monospace" font-size="18.0" fill="#111827" text-anchor="start">00 00 00 40 00 00 40 40 28 91 2A</text>
<text x="118.0" y="630.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" font-style="italic" fill="#111827" text-anchor="start">header · LEN · payload (little-endian test values) · CRC = 0x2891 · terminator</text>
<rect x="100.0" y="670.0" width="800.0" height="110.0" rx="7" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1.3"/>
<text x="118.0" y="698.0" font-family="Arial, Helvetica, sans-serif" font-size="19.0" font-weight="700" fill="#111827" text-anchor="start">Archived stream</text>
<text x="118.0" y="724.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">regex  X(.+)Y(.+)GX(.+)GY(.+)GZ(.+)</text>
<text x="118.0" y="747.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">no header · no length · no checksum</text>
<text x="118.0" y="770.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">split frames are lost; concatenated frames are misparsed</text>
<rect x="930.0" y="670.0" width="820.0" height="110.0" rx="7" fill="#FFF5E8" stroke="#B7792A" stroke-width="1.5" stroke-dasharray="2 5"/>
<text x="948.0" y="698.0" font-family="Arial, Helvetica, sans-serif" font-size="19.0" font-weight="700" fill="#111827" text-anchor="start">Proposed frame — recommendation only</text>
<text x="948.0" y="724.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">explicit header, length and terminator; CRC-16 over LEN + payload</text>
<text x="948.0" y="747.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">tested in test_protocol.py but not emitted by the archived firmware</text>
<text x="50.0" y="820.0" font-family="Arial, Helvetica, sans-serif" font-size="18.0" fill="#111827" text-anchor="start">CRC-16/CCITT-FALSE: polynomial 0x1021, initial value 0xFFFF, big-endian; known vector &#x27;123456789&#x27; → 0x29B1.</text>
</svg>
